<svg viewBox="0 0 1400 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1-title fig1-desc"><title id="fig1-title">Figure 1. A Peircean Architecture of Coordinated Human–AI Intelligence</title><desc id="fig1-desc">Nested loop: Human supplies purpose and accountability to a human–AI system in which an LLM generates signs and ACT-R organizes them into goals, memories, habits, and actions.</desc><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#1a1713"></path></marker><marker id="arch-arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#7d4333"></path></marker><marker id="arch-arrow-env" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#5a513e"></path></marker></defs><rect width="1400" height="1020" fill="#f3eee4"></rect><text x="64" y="42" fill="#756e63" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3.2">FIGURE 1</text><text x="64" y="78" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="29" font-weight="500">A Peircean Architecture of Coordinated Human–AI Intelligence</text><rect x="48" y="100" width="1304" height="568" rx="8" fill="#f7efe8" stroke="#7d4333" stroke-width="1.75"></rect><text x="72" y="132" fill="#7d4333" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.6">FINAL INTERPRETANT</text><text x="72" y="168" fill="#7d4333" font-family="Newsreader, Georgia, serif" font-size="33" font-weight="500">Human</text><text x="72" y="196" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">embodied, affective, normative, socially situated intelligence</text><text x="72" y="222" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="19">supplies embodied interpretation, values, purposes, and accountability</text><rect x="72" y="276" width="1256" height="368" rx="6" fill="#fbf8f2" stroke="#2a4558" stroke-width="1.35" stroke-dasharray="7 5"></rect><text x="96" y="304" fill="#2a4558" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">HUMAN–AI SYSTEM</text><text x="96" y="328" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="19" font-style="italic">coordinated interpretive and action loop</text><rect x="100" y="348" width="488" height="272" rx="5" fill="#e8eef2" stroke="#2a4558" stroke-width="1.6"></rect><text x="124" y="380" fill="#2a4558" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">SIGN</text><text x="124" y="418" fill="#2a4558" font-family="Newsreader, Georgia, serif" font-size="33" font-weight="500">LLM</text><text x="124" y="448" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">neural sign interpreter and generator</text><text x="124" y="496" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="19">transforms and generates signs</text><text x="124" y="546" fill="#756e63" font-family="Newsreader, Georgia, serif" font-size="19" font-style="italic">provides neural flexibility</text><rect x="812" y="348" width="488" height="272" rx="5" fill="#e6efe9" stroke="#385247" stroke-width="1.6"></rect><text x="836" y="380" fill="#385247" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">IMMEDIATE INTERPRETANT</text><text x="836" y="418" fill="#385247" font-family="Newsreader, Georgia, serif" font-size="33" font-weight="500">ACT-R</text><text x="836" y="448" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">symbolic–subsymbolic cognitive organizer</text><text x="836" y="492" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="19">organizes signs into goals, memories,</text><text x="836" y="512" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="19">habits, and actions</text><text x="836" y="560" fill="#756e63" font-family="Newsreader, Georgia, serif" font-size="19" font-style="italic">provides symbolic cognitive architecture</text><line x1="608" y1="430" x2="792" y2="430" stroke="#1a1713" stroke-width="1.4" marker-end="url(#arch-arrow)"></line><text x="700" y="418" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="17" font-style="italic" text-anchor="middle">signs</text><line x1="792" y1="512" x2="608" y2="512" stroke="#1a1713" stroke-width="1.4" marker-end="url(#arch-arrow)"></line><text x="700" y="538" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="17" font-style="italic" text-anchor="middle">habits · goals · memories</text><line x1="700" y1="668" x2="700" y2="718" stroke="#1a1713" stroke-width="1.4" marker-end="url(#arch-arrow)"></line><text x="716" y="700" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="17" font-style="italic">adaptive action</text><rect x="48" y="728" width="1304" height="112" rx="8" fill="#ece6d8" stroke="#5a513e" stroke-width="1.75"></rect><text x="72" y="760" fill="#5a513e" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.6">OBJECT</text><text x="72" y="794" fill="#5a513e" font-family="Newsreader, Georgia, serif" font-size="31" font-weight="500">Environment</text><text x="72" y="822" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="19">supplies objects, resistance, feedback, and consequences</text><text x="700" y="888" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">Intelligence emerges through the ongoing transformation of signs into</text><text x="700" y="912" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">interpretants, habits, and adaptive action.</text></svg>