<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig3-title fig3-desc"><title id="fig3-title">Figure 3. The Essential Bridge</title><desc id="fig3-desc">Three-part bridge: LLM neural flexibility, ACT-R symbolic cognitive architecture, and interaction with the world and the human supplying grounding, purpose, and correction.</desc><defs><marker id="br-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#1a1713"></path></marker></defs><rect width="1400" height="920" fill="#f3eee4"></rect><text x="64" y="42" fill="#756e63" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3.2">FIGURE 3</text><text x="64" y="78" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="29" font-weight="500">The Essential Bridge</text><text x="64" y="108" fill="#756e63" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">Human–AI system = coordinated interpretive and action loop</text><rect x="56" y="140" width="400" height="420" rx="6" fill="#e8eef2" stroke="#2a4558" stroke-width="1.7"></rect><text x="80" y="176" fill="#2a4558" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">1 · SIGN</text><text x="80" y="220" fill="#2a4558" font-family="Newsreader, Georgia, serif" font-size="31">LLM</text><text x="80" y="252" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">neural sign interpreter</text><text x="80" y="274" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">and generator</text><text x="80" y="336" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">transforms and</text><text x="80" y="360" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">generates signs</text><text x="80" y="430" fill="#2a4558" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">provides neural</text><text x="80" y="458" fill="#2a4558" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">flexibility</text><rect x="500" y="140" width="400" height="420" rx="6" fill="#e6efe9" stroke="#385247" stroke-width="1.7"></rect><text x="524" y="176" fill="#385247" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">2 · ORGANIZER</text><text x="524" y="220" fill="#385247" font-family="Newsreader, Georgia, serif" font-size="31">ACT-R</text><text x="524" y="252" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">symbolic–subsymbolic</text><text x="524" y="274" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">cognitive organizer</text><text x="524" y="336" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">organizes signs into goals,</text><text x="524" y="360" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">memories, habits, and actions</text><text x="524" y="430" fill="#385247" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">provides symbolic</text><text x="524" y="458" fill="#385247" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">cognitive architecture</text><rect x="944" y="140" width="400" height="420" rx="6" fill="#f3e6dc" stroke="#7d4333" stroke-width="1.7"></rect><text x="968" y="176" fill="#7d4333" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.2">3 · GROUND</text><text x="968" y="220" fill="#7d4333" font-family="Newsreader, Georgia, serif" font-size="29">Human + world</text><text x="968" y="252" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">embodied interpretation</text><text x="968" y="274" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic">and environmental resistance</text><text x="968" y="336" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">values, purposes,</text><text x="968" y="360" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">accountability, consequences</text><text x="968" y="430" fill="#7d4333" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">supplies grounding,</text><text x="968" y="458" fill="#7d4333" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic">purpose, and correction</text><rect x="56" y="596" width="1288" height="88" rx="6" fill="#ece6d8" stroke="#5a513e" stroke-width="1.6"></rect><text x="80" y="632" fill="#5a513e" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">ENVIRONMENT — THE SHARED GROUND OF THE LOOP</text><text x="80" y="662" fill="#1a1713" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="20">supplies objects, resistance, feedback, and consequences to every term above</text><text x="700" y="736" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" text-anchor="middle">That is the essential bridge:</text><text x="700" y="768" fill="#1a1713" font-family="Newsreader, Georgia, serif" font-size="22" text-anchor="middle">neural flexibility · symbolic cognitive architecture · grounding, purpose, correction</text><text x="700" y="820" fill="#756e63" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic" text-anchor="middle">Intelligence emerges through the ongoing transformation of signs into</text><text x="700" y="844" fill="#756e63" font-family="Newsreader, Georgia, serif" font-size="20" font-style="italic" text-anchor="middle">interpretants, habits, and adaptive action.</text></svg>